<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IDS PMC Tool</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --ink:#1c2128; --ink-soft:#4b5563; --paper:#f6f3ee; --card:#ffffff;
    --line:#e4ddd0; --accent:#c1592b; --accent-dark:#a3461e;
    /* Derived visual-status palette: grey=not started/on-time,
       red=not started/delayed, blue=in progress/on-time,
       yellow=in progress/delayed, green=done, purple=revisions required,
       orange=selection pending. */
    --vs-green:#15803d; --vs-green-bg:#dcfce7;
    --vs-blue:#1d4ed8; --vs-blue-bg:#dbeafe;
    --vs-yellow:#b45309; --vs-yellow-bg:#fef3c7;
    --vs-red:#dc2626; --vs-red-bg:#fee2e2;
    --vs-grey:#57606f; --vs-grey-bg:#e2e5ea;
    --vs-purple:#7e22ce; --vs-purple-bg:#f3e8ff;
    --vs-orange:#c2410c; --vs-orange-bg:#ffedd5;
    --na:#7d8794; --na-bg:#eceef1;
    /* legacy aliases still used by payment-status chips (Pending/Partial/Paid,
       an unrelated vocabulary — not part of the derived scheme above) */
    --done:#15803d; --done-bg:#dcfce7;
    --progress:#b45309; --progress-bg:#fef3c7;
    --delayed:#dc2626; --delayed-bg:#fee2e2;
    --notstarted:#57606f; --notstarted-bg:#e2e5ea;
    --shadow: 0 1px 2px rgba(28,33,40,.06), 0 4px 14px rgba(28,33,40,.05);
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{margin:0 0 4px 0; font-weight:650; letter-spacing:-.01em;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  .app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- Top bar ---------- */
  .topbar{background:var(--ink);color:#f6f3ee;padding:10px 18px;display:flex;align-items:center;
    justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:40;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em;}
  .brand .mark{width:28px;height:28px;border-radius:7px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;}
  .brand small{display:block;font-weight:400;opacity:.65;font-size:11px;margin-top:1px;}
  .role-switch{display:flex;background:rgba(255,255,255,.08);border-radius:8px;padding:3px;gap:2px;}
  .role-switch button{background:transparent;border:none;color:#cfd3d8;padding:7px 12px;border-radius:6px;
    font-size:12.5px;font-weight:600;}
  .role-switch button.active{background:var(--accent);color:#fff;}
  .storage-note{font-size:11px;opacity:.55;}

  /* ---------- Breadcrumb / project bar ---------- */
  .projectbar{background:var(--card);border-bottom:1px solid var(--line);padding:10px 18px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:48px;z-index:30;}
  .back-btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 10px;font-size:12.5px;
    font-weight:600;color:var(--ink-soft);}
  .back-btn:hover{border-color:var(--accent);color:var(--accent);}
  .projectbar .pname{font-weight:700;font-size:15px;}
  .projectbar .paddr{font-size:12px;color:var(--ink-soft);}
  .tabs{display:flex;gap:4px;padding:0 18px;background:var(--card);border-bottom:1px solid var(--line);
    overflow-x:auto;position:sticky;top:92px;z-index:20;}
  .tabs button{background:none;border:none;padding:11px 14px;font-size:13px;font-weight:600;color:var(--ink-soft);
    border-bottom:2.5px solid transparent;white-space:nowrap;}
  .tabs button.active{color:var(--accent-dark);border-bottom-color:var(--accent);}

  .content{flex:1;padding:18px;max-width:1280px;width:100%;margin:0 auto;}

  /* ---------- Cards / grid ---------- */
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;
    box-shadow:var(--shadow);}
  .proj-card{cursor:pointer;transition:transform .12s, box-shadow .12s;}
  .proj-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(28,33,40,.1);}
  .proj-card .pct-row{display:flex;align-items:center;gap:10px;margin:10px 0 8px;}
  .pct-bar{flex:1;height:8px;border-radius:5px;background:var(--notstarted-bg);overflow:hidden;}
  .pct-bar > div{height:100%;background:var(--accent);border-radius:5px;}
  .pct-num{font-size:13px;font-weight:700;color:var(--accent-dark);width:38px;text-align:right;}
  .meta-row{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;}
  .badge.warn{background:var(--progress-bg);color:var(--progress);}
  .badge.ok{background:var(--done-bg);color:var(--done);}
  .new-project-card{border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);font-weight:600;font-size:13px;cursor:pointer;min-height:120px;}
  .new-project-card:hover{border-color:var(--accent);color:var(--accent);}
  .toolbar-row{display:flex;justify-content:flex-end;gap:8px;margin-bottom:14px;}

  /* ---------- Status chips / cells ---------- */
  .status-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;
    font-size:11px;font-weight:700;white-space:nowrap;}
  .status-chip.vs-green{background:var(--vs-green-bg);color:var(--vs-green);}
  .status-chip.vs-blue{background:var(--vs-blue-bg);color:var(--vs-blue);}
  .status-chip.vs-yellow{background:var(--vs-yellow-bg);color:var(--vs-yellow);}
  .status-chip.vs-red{background:var(--vs-red-bg);color:var(--vs-red);}
  .status-chip.vs-grey{background:var(--vs-grey-bg);color:var(--vs-grey);}
  .status-chip.vs-purple{background:var(--vs-purple-bg);color:var(--vs-purple);}
  .status-chip.vs-orange{background:var(--vs-orange-bg);color:var(--vs-orange);}
  .status-chip.N-A{background:var(--na-bg);color:var(--na);}
  .status-chip.Partial{background:var(--progress-bg);color:var(--progress);}
  .status-chip.Pending{background:var(--notstarted-bg);color:var(--notstarted);}
  .status-chip.Paid{background:var(--done-bg);color:var(--done);}
  .agency-chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:600;
    background:var(--na-bg);color:var(--na);}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}

  .stat-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px;}
  .stat-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;}
  .stat-box .label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:700;}
  .stat-box .value{font-size:22px;font-weight:750;margin-top:3px;}
  .stat-box .value.accent{color:var(--accent-dark);}
  .stat-box .value.red{color:var(--delayed);}

  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);
    font-weight:700;margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;}
  .section-title:first-child{margin-top:0;}

  /* ---------- Filters ---------- */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .filters select, .filters input[type=text]{padding:7px 10px;border:1px solid var(--line);border-radius:7px;
    font-size:12.5px;background:#fff;color:var(--ink);}

  /* ---------- Tracker / BOQ grid ---------- */
  .space-block{margin-bottom:26px;}
  .space-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:10px;flex-wrap:wrap;}
  .space-head h3{font-size:15px;}
  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff;}
  table.tracker{border-collapse:collapse;width:100%;font-size:12.5px;}
  table.tracker th{background:#faf8f4;text-align:left;padding:8px 10px;font-size:11px;text-transform:uppercase;
    letter-spacing:.03em;color:var(--ink-soft);border-bottom:1px solid var(--line);white-space:nowrap;}
  table.tracker td{padding:6px 8px;border-bottom:1px solid #f0ede6;vertical-align:middle;white-space:nowrap;}
  table.tracker tr:last-child td{border-bottom:none;}
  table.tracker td.subitem-cell{white-space:normal;min-width:190px;}
  .subitem-cell .cat{display:block;font-size:10.5px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;
    letter-spacing:.03em;}
  .subitem-cell .agency-chip{margin-top:3px;}
  input.inline-edit, select.inline-edit{border:1px solid transparent;background:transparent;font:inherit;
    color:inherit;padding:3px 4px;border-radius:4px;width:100%;min-width:0;}
  input.inline-edit:hover, select.inline-edit:hover{border-color:var(--line);}
  input.inline-edit:focus, select.inline-edit:focus{border-color:var(--accent);background:#fff;outline:none;}
  .stage-cell{width:44px;height:26px;border-radius:6px;cursor:pointer;border:1px solid transparent;
    display:flex;align-items:center;justify-content:center;position:relative;}
  .stage-cell.vs-green{background:var(--vs-green);}
  .stage-cell.vs-blue{background:var(--vs-blue);}
  .stage-cell.vs-yellow{background:var(--vs-yellow);}
  .stage-cell.vs-red{background:var(--vs-red);}
  .stage-cell.vs-grey{background:var(--vs-grey-bg);border-color:var(--line);}
  .stage-cell.vs-purple{background:var(--vs-purple);}
  .stage-cell.vs-orange{background:var(--vs-orange);}
  .stage-cell.N-A{background:var(--na-bg);border:1px dashed var(--na);}
  .stage-cell:hover{outline:2px solid var(--ink);outline-offset:1px;}
  .add-material-row{padding:10px;border-top:1px dashed var(--line);}

  /* ---------- Schedule chart ---------- */
  .sched-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff;position:relative;}
  .sched-grid{position:relative;}
  .sched-header{display:flex;border-bottom:1px solid var(--line);background:#faf8f4;position:sticky;top:0;z-index:5;}
  .sched-label-col{width:220px;min-width:220px;flex-shrink:0;padding:8px 10px;font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);border-right:1px solid var(--line);
    position:sticky;left:0;background:#faf8f4;z-index:6;}
  .sched-timeline-head{position:relative;height:32px;}
  .sched-tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:10px;color:var(--ink-soft);
    padding:6px 0 0 4px;white-space:nowrap;}
  .sched-space-group{border-bottom:1px solid var(--line);}
  .sched-space-title{padding:6px 10px;font-size:11.5px;font-weight:700;color:var(--accent-dark);background:#fbf9f5;
    position:sticky;left:0;width:220px;}
  .sched-row{display:flex;align-items:center;min-height:38px;border-top:1px solid #f0ede6;}
  .sched-row-label{width:220px;min-width:220px;flex-shrink:0;padding:6px 10px;font-size:12.5px;position:sticky;left:0;
    background:#fff;border-right:1px solid var(--line);z-index:4;}
  .sched-row-timeline{position:relative;flex:1;height:38px;}
  .sched-bar{position:absolute;top:6px;height:26px;border-radius:6px;cursor:grab;display:flex;align-items:center;
    padding:0 8px;font-size:11px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;user-select:none;}
  .sched-bar.vs-green{background:var(--vs-green);}
  .sched-bar.vs-blue{background:var(--vs-blue);}
  .sched-bar.vs-yellow{background:var(--vs-yellow);}
  .sched-bar.vs-red{background:var(--vs-red);}
  .sched-bar.vs-grey{background:var(--vs-grey);}
  .sched-bar.vs-purple{background:var(--vs-purple);}
  .sched-bar.vs-orange{background:var(--vs-orange);}
  .sched-bar.critical{outline:3px solid var(--accent);outline-offset:1px;}
  .sched-bar:active{cursor:grabbing;}
  .sched-bar-fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.35);pointer-events:none;}
  .sched-bar-label{position:relative;z-index:1;}
  .sched-resize{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:2;}
  .sched-svg{position:absolute;top:0;left:0;pointer-events:none;z-index:2;}
  .sched-today{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);opacity:.5;z-index:3;}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:7px;border:1px solid var(--line);
    background:#fff;color:var(--ink);font-size:13px;font-weight:600;}
  .btn:hover{border-color:var(--accent);color:var(--accent-dark);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff;}
  .btn.small{padding:5px 10px;font-size:12px;}
  .btn.ghost{border-color:transparent;background:transparent;}

  /* ---------- Forms / modal ---------- */
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;}
  .field input, .field select, .field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);
    border-radius:7px;font-size:13.5px;background:#fff;color:var(--ink);}
  .field textarea{min-height:70px;resize:vertical;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .field-hint{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(28,33,40,.5);display:flex;align-items:center;
    justify-content:center;z-index:100;padding:16px;}
  .modal{background:#fff;border-radius:12px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;
    box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .modal h3{margin-bottom:14px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .space-adder{display:flex;gap:6px;margin-bottom:8px;}
  .space-adder input{flex:1;}
  .chip-remove{background:var(--notstarted-bg);border-radius:6px;padding:5px 9px;font-size:12px;
    display:inline-flex;align-items:center;gap:6px;margin:0 5px 5px 0;}
  .chip-remove button{background:none;border:none;color:var(--ink-soft);font-weight:800;}

  /* ---------- Daily log ---------- */
  .log-feed{display:flex;flex-direction:column;gap:10px;}
  .log-entry{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;}
  .log-entry.blocker{border-left:4px solid var(--delayed);}
  .log-entry .lhead{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-bottom:5px;}
  .log-entry .lhead b{color:var(--ink);}
  .log-entry p{margin:0;font-size:13.5px;line-height:1.5;}

  /* ---------- Progress report ---------- */
  .report-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px;}
  .report-card h2{font-size:20px;}
  .report-sub{color:var(--ink-soft);font-size:13px;margin-bottom:18px;}
  ul.plain{margin:0;padding-left:18px;}
  ul.plain li{margin-bottom:5px;font-size:13.5px;}
  .print-only{display:none;}
  .progress-ring{width:110px;height:110px;min-width:110px;border-radius:50%;position:relative;flex-shrink:0;
    background:conic-gradient(var(--accent) calc(var(--pct)*1%), var(--notstarted-bg) 0);}
  .progress-ring::before{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff;}
  .progress-ring .ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:800;color:var(--accent-dark);}
  @media print{
    .topbar,.projectbar,.tabs,.no-print{display:none !important;}
    .content{padding:0;max-width:none;}
    body{background:#fff;}
  }

  /* ---------- Client view ---------- */
  .client-hero{background:linear-gradient(135deg,var(--ink) 0%, #2b3340 100%);color:#fff;border-radius:14px;
    padding:26px;margin-bottom:18px;}
  .client-hero .big{font-size:40px;font-weight:800;letter-spacing:-.02em;}
  .client-hero .lbl{font-size:12px;opacity:.7;text-transform:uppercase;letter-spacing:.04em;}
  .client-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
  .space-chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}

  .empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;z-index:200;box-shadow:var(--shadow);
    opacity:0;pointer-events:none;transition:opacity .2s;}
  .toast.show{opacity:1;}

  @media (max-width:640px){
    .content{padding:12px;}
    .projectbar{top:48px;}
    .tabs{top:88px;}
    .field-row{grid-template-columns:1fr;}
    .client-hero .big{font-size:32px;}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <div class="brand"><div class="mark">ID</div><div>IDS PMC Tool<small>Ideaform Design Studio &mdash; Project Management Console</small></div></div>
    <div class="role-switch" id="roleSwitch"></div>
  </div>
  <div id="belowBar"></div>
  <div class="content" id="content"><div class="empty-state">Loading&hellip;</div></div>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
// ============================= STATE =============================
var STATE = {
  data: null,
  role: 'admin',            // 'engineer' | 'admin' | 'client'
  currentProjectId: null,
  currentTab: null,
  loggedByName: localStorage.getItem('pmc_logged_by') || '',
  filters: { space:'', category:'', stage:'', status:'' },
  locked: false,             // true when opened via a client share link — can't switch role/project
  showCatalog: false,        // Materials Catalog screen (Admin, not project-scoped)
  boqExpandedRows: {}        // BoqItemID -> true, rows manually switched to L x W x Depth entry
};

// A share link like ?project=P-001&role=client locks a visitor to that single
// project's Client view — no role switcher, no way to browse other projects.
(function(){
  var params = new URLSearchParams(window.location.search);
  var role = params.get('role');
  var project = params.get('project');
  if(role && ['engineer','admin','client'].indexOf(role)>-1) STATE.role = role;
  if(project) STATE.currentProjectId = project;
  if(role==='client' && project) STATE.locked = true;
})();

var STATUS_LIST = ['Not Started','In Progress','Done','N/A'];
// Execution-stage status vocabulary (Phase 8) — matches Code.js's
// ACTIVITY_STATUSES exactly (from the real IDS_DEEPAK_280426 site-tracking
// sheet).
var ACTIVITY_STATUS_LIST = ['Not Started','In Progress','Done','Not Required','Revisions Required','Selection Pending'];
var DELAY_REASONS = ['Design Finalization Delay','Material Selection Delay','Order Placement Delay','Material Delivery Delay (Vendor)','Execution Agency Delay','Other'];
// Delay is derived, not stored: compares the current date against the
// original plan (and, failing that, against today) rather than relying on a
// manually-set "Delayed" status. Done is always green regardless of timing.
// 'Not Required' behaves like N/A (excluded, neutral). 'Revisions Required'/
// 'Selection Pending' are blocked states shown in their own colors
// regardless of date — not date-delay-derived like Not Started/In Progress.
function deriveVisual(status, originalDate, currentDate){
  if(status==='Done') return {cls:'vs-green', delayed:false};
  if(status==='N/A' || status==='Not Required') return {cls:'N-A', delayed:false};
  if(status==='Revisions Required') return {cls:'vs-purple', delayed:true};
  if(status==='Selection Pending') return {cls:'vs-orange', delayed:true};
  var delayed = false;
  if(currentDate && originalDate && currentDate > originalDate) delayed = true;
  if(currentDate && todayISO() > currentDate) delayed = true;
  if(status==='In Progress') return {cls: delayed?'vs-yellow':'vs-blue', delayed:delayed};
  return {cls: delayed?'vs-red':'vs-grey', delayed:delayed};
}
function todayISO(){
  // Local calendar date, not UTC — toISOString() would report the wrong date
  // for part of the day in any positive-UTC-offset timezone (e.g. IST).
  var d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDate(iso){
  if(!iso) return '&mdash;';
  var d = new Date(iso);
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
}
function fmtMoney(n){
  n = Number(n)||0;
  return '₹' + n.toLocaleString('en-IN');
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

// ============================= BACKEND API =============================
var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzEPFiPoZMiq-BefAbPBvjG-o0VZkMH4UxNVQchUfQJyw3Xag6eAxKA2MVBRVcLsKiA3w/exec';

function apiGet(action){
  return fetch(APPS_SCRIPT_URL + '?action=' + encodeURIComponent(action))
    .then(function(r){ return r.json(); })
    .then(function(res){ if(!res.ok) throw new Error(res.error||'Request failed'); return res.data; });
}
function apiPost(action, payload){
  // text/plain avoids a CORS preflight (Apps Script doesn't answer OPTIONS).
  return fetch(APPS_SCRIPT_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action: action, payload: payload||{} })
  }).then(function(r){ return r.json(); })
    .then(function(res){ if(!res.ok) throw new Error(res.error||'Request failed'); return res.data; });
}

// ============================= DERIVED HELPERS =============================
function spacesOf(projectId){
  return STATE.data.spaces.filter(function(s){return s.ProjectID===projectId;})
    .sort(function(a,b){return (a.SortOrder||0)-(b.SortOrder||0);});
}
function boqItemsOf(projectId, spaceId){
  return STATE.data.boqItems.filter(function(t){
    return t.ProjectID===projectId && (!spaceId || t.SpaceID===spaceId);
  });
}
function logsOf(projectId){
  return STATE.data.dailyLog.filter(function(l){return l.ProjectID===projectId;});
}
// Overall % is an equal-weighted blend of the three tracked phases (Design,
// Material Selection, Execution) — a phase with no data yet (e.g. no
// activities created) is excluded from the blend rather than counted as 0%.
function stagePct_(rows, stagesKey){
  var total=0, done=0;
  rows.forEach(function(r){ (r[stagesKey]||[]).forEach(function(s){ total++; if(s.status==='Done'||s.status==='N/A') done++; }); });
  return total ? done/total*100 : null;
}
function blendPct_(spaces, boqRows, actRows){
  var designPct = stagePct_(spaces, 'Design');
  var materialPct = stagePct_(boqRows, 'Stages');
  // 'Not Required' stages are excluded, same as N/A elsewhere — they don't
  // apply to this space, so they shouldn't drag the average down.
  var relevantActs = actRows.filter(function(r){ return r.Status!=='Not Required'; });
  var execPct = null;
  if(relevantActs.length){
    execPct = relevantActs.reduce(function(a,r){return a+(Number(r.PercentComplete)||0);},0) / relevantActs.length;
  }
  var parts = [designPct, materialPct, execPct].filter(function(p){return p!==null;});
  return parts.length ? Math.round(parts.reduce(function(a,b){return a+b;},0)/parts.length) : 0;
}
function projectPct(projectId){
  return blendPct_(spacesOf(projectId), boqItemsOf(projectId), activitiesOf(projectId));
}
function spacePct(projectId, spaceId){
  var spaces = spacesOf(projectId).filter(function(s){return s.SpaceID===spaceId;});
  var actRows = activitiesOf(projectId).filter(function(a){return a.SpaceID===spaceId;});
  return blendPct_(spaces, boqItemsOf(projectId, spaceId), actRows);
}
function isOverdue(stage){
  var vis = deriveVisual(stage.status, stage.originalTarget, stage.target);
  return vis.delayed;
}
function delayedItems(projectId){
  var out = [];
  boqItemsOf(projectId).forEach(function(r){
    var sp = STATE.data.spaces.filter(function(s){return s.SpaceID===r.SpaceID;})[0];
    r.Stages.forEach(function(s){
      var vis = deriveVisual(s.status, s.originalTarget, s.target);
      if(vis.delayed){
        out.push({space: sp?sp.Name:'', category:r.Category, material:r.MaterialName, stage:s.stage,
          status:s.status, target:s.target, delayReason:s.delayReason, overdue:true});
      }
    });
  });
  return out;
}
function projectCashSummary(projectId){
  var boq=0;
  boqItemsOf(projectId).forEach(function(r){ boq+=Number(r.Amount)||0; });
  return { boq:boq };
}
// Total BOQ value broken down by Category, project-wide — matches the
// layout of the original Excel's Summary Sheet tab (Category -> Amount).
function categoryBoqSummary(projectId){
  var byCategory = {};
  boqItemsOf(projectId).forEach(function(r){
    byCategory[r.Category] = (byCategory[r.Category]||0) + (Number(r.Amount)||0);
  });
  return Object.keys(byCategory).map(function(cat){
    return { category: cat, total: byCategory[cat] };
  }).sort(function(a,b){ return b.total-a.total; });
}
function daysToMoveIn(project){
  if(!project.TargetMoveIn) return null;
  var target = new Date(project.TargetMoveIn);
  var today = new Date(todayISO());
  return Math.ceil((target-today)/86400000);
}

function statBox(label, value, tone){
  return '<div class="stat-box"><div class="label">'+label+'</div><div class="value '+(tone||'')+'">'+value+'</div></div>';
}
// One clickable chip per trade (agency) active in this space, colored by that
// trade's actual Schedule activity — click through to see original vs.
// current dates, delay reason, and critical-path status.
function spaceActivityChips(pid, spaceId){
  var acts = activitiesOf(pid).filter(function(a){ return a.SpaceID===spaceId; });
  var critical = computeCriticalPath(pid).map(function(a){return a.ActivityID;});
  var html = '<div class="space-chip-row">';
  acts.forEach(function(a){
    var vis = deriveVisual(a.Status, a.OriginalEndDate, a.EndDate);
    var isCritical = critical.indexOf(a.ActivityID)>-1;
    html += '<span class="status-chip '+vis.cls+'" style="cursor:pointer;'+(isCritical?'box-shadow:0 0 0 2px var(--accent) inset;':'')+'" onclick="openActivityDetailModal(\''+a.ActivityID+'\')" title="Click for details">'+
      '<span class="dot"></span>'+escapeHtml(a.Agency)+(isCritical?' &#9888;':'')+'</span>';
  });
  if(!acts.length) html += '<span style="font-size:12px;color:var(--ink-soft);">No trades started in this space yet</span>';
  return html + '</div>';
}

// ============================= DESIGN (per space) =============================
// Rolls up a set of stage objects (already-derived) into one chip class:
// Done only if every stage is Done; otherwise grey/blue if none are delayed,
// red/yellow if any are — matching whichever of Not Started/In Progress the
// rollup text says.
function rollupVisual(stages, rollupText){
  if(rollupText==='Done') return 'vs-green';
  var anyDelayed = stages.some(function(s){ return deriveVisual(s.status, s.originalTarget, s.target).delayed; });
  if(rollupText==='In Progress') return anyDelayed ? 'vs-yellow' : 'vs-blue';
  return anyDelayed ? 'vs-red' : 'vs-grey';
}
function renderDesignRow(sp){
  var design = sp.Design || [];
  var rollup = sp.DesignRollup || 'Not Started';
  var cells = design.map(function(d){
    var vis = deriveVisual(d.status, d.originalTarget, d.target);
    var title = d.stage+': '+d.status+(vis.delayed?' (delayed)':'')+(d.target? ' · target '+fmtDate(d.target):'')+(d.delayReason?' · '+d.delayReason:'')+(d.note? ' · '+d.note:'');
    return '<div style="text-align:center;">'+
      '<div class="stage-cell '+vis.cls+'" style="width:52px;" title="'+escapeHtml(title)+'" onclick="openDesignStageModal(\''+sp.SpaceID+'\',\''+d.stage+'\')"></div>'+
      '<div style="font-size:10px;color:var(--ink-soft);margin-top:3px;font-weight:600;">'+escapeHtml(d.stage)+'</div>'+
    '</div>';
  }).join('');
  return '<div class="design-row" style="display:flex;align-items:center;gap:14px;margin-bottom:10px;padding:8px 10px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);">'+
    '<div style="font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);font-weight:700;">Design</div>'+
    '<div style="display:flex;gap:10px;">'+cells+'</div>'+
    '<span class="status-chip '+rollupVisual(design, rollup)+'" style="margin-left:auto;">'+rollup+'</span>'+
    '</div>';
}

  var noFloor = spaces.filter(function(s){ return !s.Floor; });

// ============================= SCHEDULE / PERT CHART =============================
var SCHED_PX_PER_DAY = 28;
function activitiesOf(projectId){
  return STATE.data.activities.filter(function(a){ return a.ProjectID===projectId; });
}
// The critical path here is the longest chain of back-to-back (zero-slack)
// predecessor -> successor activities ending at the project's latest finish.
// Since activities already carry real scheduled dates (not just abstract
// durations), "critical" reduces to: walk backward from whichever activity
// finishes last, at each step only following a predecessor whose EndDate
// exactly matches the successor's StartDate — a predecessor with any gap has
// slack and isn't blocking anything.
function computeCriticalPath(projectId){
  var acts = activitiesOf(projectId);
  if(!acts.length) return [];
  var byId = {};
  acts.forEach(function(a){ byId[a.ActivityID] = a; });
  var tail = acts.reduce(function(best,a){ return (!best || a.EndDate>best.EndDate) ? a : best; }, null);
  var chain = [tail];
  var current = tail;
  var guard = 0;
  while(guard++ < acts.length){
    var preds = (current.Predecessors||[]).map(function(id){ return byId[id]; }).filter(Boolean);
    var zeroSlack = preds.filter(function(p){ return p.EndDate === current.StartDate; });
    if(!zeroSlack.length) break;
    zeroSlack.sort(function(a,b){ return b.EndDate>a.EndDate?1:-1; });
    current = zeroSlack[0];
    chain.push(current);
  }
  return chain.reverse();
}
function openActivityDetailModal(activityId){

// Parse and arithmetic done entirely in UTC (not local time) so day-math is
// correct regardless of the browser's timezone offset — a date-only string
// parsed with a local-time suffix + re-serialized via toISOString() (which is
// always UTC) silently shifts by a day for any positive-UTC-offset timezone
// (e.g. IST) if local getDate()/setDate() are mixed in instead of their UTC
// counterparts.
function parseISODate(s){ return new Date(s+'T00:00:00Z'); }
function dayDiff(fromIso, toIso){ return Math.round((parseISODate(toIso)-parseISODate(fromIso))/86400000); }
function addDaysISO(iso, n){
  var d = parseISODate(iso);
  d.setUTCDate(d.getUTCDate()+n);
  return d.toISOString().slice(0,10);
}
function renderScheduleView(){
  return renderScheduleChart(STATE.currentProjectId, { readOnly: false, gridId: 'schedGrid', svgId: 'schedSvg' });
}
function renderScheduleChart(pid, opts){
  opts = opts || {};
  var gridId = opts.gridId || 'schedGridRO';
  var svgId = opts.svgId || 'schedSvgRO';
  var acts = activitiesOf(pid);
  var spaces = spacesOf(pid);
  if(!acts.length){
    return '<div class="empty-state">No schedule activities yet.</div>';
  }
  var starts = acts.map(function(a){return a.StartDate;}).sort();
  var ends = acts.map(function(a){return a.EndDate;}).sort();
  var rangeStart = addDaysISO(starts[0], -3);
  var rangeEnd = addDaysISO(ends[ends.length-1], 3);
  var totalDays = dayDiff(rangeStart, rangeEnd);
  var timelineWidth = totalDays*SCHED_PX_PER_DAY;

  var header = '<div class="sched-header"><div class="sched-label-col">Space / Agency</div>'+
    '<div class="sched-timeline-head" style="width:'+timelineWidth+'px;">';
  for(var d=0; d<totalDays; d+=7){
    header += '<div class="sched-tick" style="left:'+(d*SCHED_PX_PER_DAY)+'px;">'+fmtDate(addDaysISO(rangeStart,d))+'</div>';
  }
  var todayOffset = dayDiff(rangeStart, todayISO());
  header += '</div></div>';

  var critical = computeCriticalPath(pid).map(function(a){return a.ActivityID;});
  var body = '';
  spaces.forEach(function(sp){
    var rows = acts.filter(function(a){ return a.SpaceID===sp.SpaceID; });
    if(!rows.length) return;
    body += '<div class="sched-space-group"><div class="sched-space-title">'+escapeHtml(sp.Name)+'</div>';
    rows.forEach(function(a){
      var left = dayDiff(rangeStart, a.StartDate)*SCHED_PX_PER_DAY;
      var width = Math.max(dayDiff(a.StartDate, a.EndDate)*SCHED_PX_PER_DAY, 20);
      var pct = Math.max(0, Math.min(100, Number(a.PercentComplete)||0));
      var vis = deriveVisual(a.Status, a.OriginalEndDate, a.EndDate);
      var isCritical = critical.indexOf(a.ActivityID)>-1;
      body += '<div class="sched-row">'+
        '<div class="sched-row-label">'+escapeHtml(a.Agency)+(isCritical?' <span style="color:var(--accent-dark);font-weight:800;" title="On the critical path">&#9888;</span>':'')+'<div style="font-size:10.5px;color:var(--ink-soft);">'+fmtDate(a.StartDate)+' &rarr; '+fmtDate(a.EndDate)+'</div></div>'+
        '<div class="sched-row-timeline" style="width:'+timelineWidth+'px;">'+
          '<div class="sched-bar '+vis.cls+(isCritical?' critical':'')+'" data-activity-id="'+a.ActivityID+'" style="left:'+left+'px;width:'+width+'px;'+(opts.readOnly?'cursor:default;':'')+'" title="'+escapeHtml(a.Agency+': '+a.Status+' ('+pct+'%)'+(isCritical?' · critical path':''))+'">'+
            '<div class="sched-bar-fill" style="width:'+pct+'%;"></div>'+
            '<span class="sched-bar-label">'+escapeHtml(a.Agency)+'</span>'+
            (opts.readOnly? '' : '<div class="sched-resize" data-activity-id="'+a.ActivityID+'"></div>')+
          '</div>'+
        '</div></div>';
    });
    body += '</div>';
  });

  var hint = opts.readOnly ? '' :
    '<div class="field-hint" style="margin-bottom:10px;">Drag a bar to reschedule, drag its right edge to change duration, click it to edit status / dependencies. Dependent activities shift automatically.</div>';

  return hint+
    '<div class="sched-wrap"><div class="sched-grid" id="'+gridId+'">'+
    header + body +
    '<div class="sched-today" style="left:'+(220+todayOffset*SCHED_PX_PER_DAY)+'px;top:0;bottom:0;" title="Today"></div>'+
    '<svg class="sched-svg" id="'+svgId+'"></svg>'+
    '</div></div>';
}

function drawDependencyLines(gridId, svgId, projectId){
  var grid = document.getElementById(gridId||'schedGrid');
  var svg = document.getElementById(svgId||'schedSvg');
  if(!grid || !svg) return;
  var gridRect = grid.getBoundingClientRect();
  svg.setAttribute('width', grid.scrollWidth);
  svg.setAttribute('height', grid.scrollHeight);
  var lines = '';
  var acts = activitiesOf(projectId||STATE.currentProjectId);
  acts.forEach(function(a){
    (a.Predecessors||[]).forEach(function(predId){
      var predEl = grid.querySelector('.sched-bar[data-activity-id="'+predId+'"]');
      var succEl = grid.querySelector('.sched-bar[data-activity-id="'+a.ActivityID+'"]');
      if(!predEl || !succEl) return;
      var pr = predEl.getBoundingClientRect(), sr = succEl.getBoundingClientRect();
      var x1 = pr.right - gridRect.left, y1 = pr.top + pr.height/2 - gridRect.top;
      var x2 = sr.left - gridRect.left, y2 = sr.top + sr.height/2 - gridRect.top;
      lines += '<path d="M'+x1+','+y1+' C'+(x1+20)+','+y1+' '+(x2-20)+','+y2+' '+x2+','+y2+'" stroke="var(--ink-soft)" stroke-width="1.5" fill="none" marker-end="url(#schedArrow)"/>';
    });
  });
  svg.innerHTML = '<defs><marker id="schedArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="var(--ink-soft)"/></marker></defs>'+lines;
}

function startBarDrag(e, barEl, mode){
  e.preventDefault();
  var activityId = barEl.getAttribute('data-activity-id');
  var act = STATE.data.activities.filter(function(a){return a.ActivityID===activityId;})[0];
  var startX = e.clientX;
  var origLeft = parseInt(barEl.style.left, 10);
  var origWidth = parseInt(barEl.style.width, 10);
  var moved = false;

  function onMove(ev){
    var dx = ev.clientX - startX;
    if(Math.abs(dx) > 3) moved = true;
    if(mode==='move'){
      barEl.style.left = (origLeft + dx) + 'px';
    } else {
      barEl.style.width = Math.max(origWidth + dx, SCHED_PX_PER_DAY) + 'px';
    }
  }
  function onUp(ev){
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    if(!moved){
      openActivityModal(activityId);
      return;
    }
    var dx = ev.clientX - startX;
    var deltaDays = Math.round(dx / SCHED_PX_PER_DAY);
    var payload = { activityId: activityId };
    if(mode==='move'){
      payload.startDate = addDaysISO(act.StartDate, deltaDays);
      payload.endDate = addDaysISO(act.EndDate, deltaDays);
    } else {
      var newWidthDays = Math.max(Math.round((origWidth+dx)/SCHED_PX_PER_DAY), 1);
      payload.endDate = addDaysISO(act.StartDate, newWidthDays);
    }
    apiPost('updateActivity', payload).then(function(){
      toast('Schedule updated'); refresh();
    }).catch(function(err){ showErr(err); refresh(); });
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

    '</div>'+
    '<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button>'+
    '<button class="btn primary" id="act-save-btn" onclick="saveActivity(\''+activityId+'\')">Save</button></div>';

function saveActivity(activityId){
  var reasonEl = document.getElementById('act-reason');
  var payload = {
    activityId: activityId,
    status: document.getElementById('act-status').value,
    startDate: document.getElementById('act-start').value,
    endDate: document.getElementById('act-end').value,
    notes: document.getElementById('act-notes').value,
    percentComplete: Number(document.getElementById('act-percent').value)||0,
    delayReason: reasonEl ? reasonEl.value : ''
  };
  var deps = Array.from(document.querySelectorAll('.act-dep-cb:checked')).map(function(cb){return cb.value;}).sort();
  var act = STATE.data.activities.filter(function(a){return a.ActivityID===activityId;})[0];
  var currentDeps = ((act&&act.Predecessors)||[]).slice().sort();
  var depsChanged = JSON.stringify(deps) !== JSON.stringify(currentDeps);

  var btn = document.getElementById('act-save-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Saving…'; }

  var chain = apiPost('updateActivity', payload);
  if(depsChanged){
    chain = chain.then(function(){
      return apiPost('setActivityDependencies', { activityId: activityId, predecessors: deps });
    });
  }
  chain.then(function(){
    closeModal(); toast('Activity updated'); refresh();

// A row shows a single Quantity field ("direct" mode) whenever Length and
// Width are both 1 — true for count-style items (Nos./L.S., e.g. a sofa or
// wall lamp) and for anything manually collapsed via the Qty link — and
// three L x W x Depth/Nos fields otherwise. Toggling between the two never
// loses the underlying quantity (collapsing folds L*W*D into DepthNos with
// Length/Width reset to 1; expanding just changes which inputs are shown).
function boqMeasurementCellHtml(r){
  var isDirect = !STATE.boqExpandedRows[r.BoqItemID] && Number(r.Length)===1 && Number(r.Width)===1;
  if(isDirect){
    return '<div style="display:flex;align-items:center;gap:5px;">'+
      '<input class="inline-edit" type="number" style="width:56px;" value="'+r.DepthNos+'" min="0" step="any" '+
      'oninput="onBoqFieldInput(\''+r.BoqItemID+'\',\'depthNos\',this.value)" onchange="saveBoqField(\''+r.BoqItemID+'\',\'depthNos\',this.value)">'+
      '<a href="#" onclick="boqExpandToMeasured(\''+r.BoqItemID+'\');return false;" style="font-size:10px;color:var(--ink-soft);white-space:nowrap;">L&times;W&times;D</a>'+
      '</div>';
  }
  return '<div style="display:flex;align-items:center;gap:3px;">'+
    '<input class="inline-edit" type="number" style="width:38px;" value="'+r.Length+'" min="0" step="any" title="Length" '+
    'oninput="onBoqFieldInput(\''+r.BoqItemID+'\',\'length\',this.value)" onchange="saveBoqField(\''+r.BoqItemID+'\',\'length\',this.value)">'+
    '<span style="color:var(--ink-soft);">&times;</span>'+
    '<input class="inline-edit" type="number" style="width:38px;" value="'+r.Width+'" min="0" step="any" title="Width" '+
    'oninput="onBoqFieldInput(\''+r.BoqItemID+'\',\'width\',this.value)" onchange="saveBoqField(\''+r.BoqItemID+'\',\'width\',this.value)">'+
    '<span style="color:var(--ink-soft);">&times;</span>'+
    '<input class="inline-edit" type="number" style="width:38px;" value="'+r.DepthNos+'" min="0" step="any" title="Depth/Nos" '+
    'oninput="onBoqFieldInput(\''+r.BoqItemID+'\',\'depthNos\',this.value)" onchange="saveBoqField(\''+r.BoqItemID+'\',\'depthNos\',this.value)">'+
    '<a href="#" onclick="boqCollapseToDirect(\''+r.BoqItemID+'\');return false;" style="font-size:10px;color:var(--ink-soft);white-space:nowrap;margin-left:2px;">Qty</a>'+
    '</div>';
}
function boqRowHtml(r){
  var revisedVal = (r.RevisedRate!==''&&r.RevisedRate!==undefined&&r.RevisedRate!==null) ? r.RevisedRate : '';
  return '<tr id="boq-row-'+r.BoqItemID+'">'+
    '<td>'+escapeHtml(r.MaterialName)+'</td>'+
    '<td>'+escapeHtml(r.Unit)+'</td>'+
    '<td>'+boqMeasurementCellHtml(r)+'</td>'+
    '<td><input class="inline-edit" type="number" style="width:56px;" value="'+(r.Contingency||0)+'" min="0" step="any" oninput="onBoqFieldInput(\''+r.BoqItemID+'\',\'contingency\',this.value)" onchange="saveBoqField(\''+r.BoqItemID+'\',\'contingency\',this.value)"></td>'+
    '<td id="boq-qty-'+r.BoqItemID+'">'+r.Quantity+'</td>'+
    '<td><input class="inline-edit" type="number" style="width:76px;" placeholder="'+fmtMoney(r.Rate)+'" value="'+revisedVal+'" min="0" step="any" oninput="onBoqFieldInput(\''+r.BoqItemID+'\',\'revisedRate\',this.value)" onchange="saveBoqField(\''+r.BoqItemID+'\',\'revisedRate\',this.value)"></td>'+
    '<td id="boq-amount-'+r.BoqItemID+'">'+fmtMoney(r.Amount)+'</td>'+
    '<td><span class="status-chip '+rollupVisual(r.Stages, r.RollupStatus)+'">'+escapeHtml(r.RollupStatus)+'</span></td>'+
    '<td><button class="btn small" id="boq-photos-btn-'+r.BoqItemID+'" onclick="openBoqImagesModal(\''+r.BoqItemID+'\')">'+boqPhotosBtnLabel(r)+'</button></td>'+
    '</tr>';
}
function rerenderBoqRow_(r){
  var tr = document.getElementById('boq-row-'+r.BoqItemID);
  if(!tr) return;
  var temp = document.createElement('tbody');
  temp.innerHTML = boqRowHtml(r);
  tr.replaceWith(temp.firstElementChild);
}
function boqExpandToMeasured(boqItemId){
  STATE.boqExpandedRows[boqItemId] = true;
  var r = STATE.data.boqItems.filter(function(x){return x.BoqItemID===boqItemId;})[0];
  if(r) rerenderBoqRow_(r);
}
function boqCollapseToDirect(boqItemId){
  var r = STATE.data.boqItems.filter(function(x){return x.BoqItemID===boqItemId;})[0];
  if(!r) return;
  var qty = (Number(r.Length)||0)*(Number(r.Width)||0)*(Number(r.DepthNos)||0);
  delete STATE.boqExpandedRows[boqItemId];
  r.Length = 1; r.Width = 1; r.DepthNos = qty||1;
  boqRowRecompute_(r);
  rerenderBoqRow_(r);
  var qtyEl = document.getElementById('boq-qty-'+boqItemId);
  var amtEl = document.getElementById('boq-amount-'+boqItemId);
  if(qtyEl) qtyEl.textContent = r.Quantity;
  if(amtEl) amtEl.textContent = fmtMoney(r.Amount);
  apiPost('updateBoqItem', { boqItemId: boqItemId, length: 1, width: 1, depthNos: r.DepthNos }).catch(function(err){ showErr(err); refresh(); });
}
function boqRowRecompute_(r){
  var qty = (Number(r.Length)||0)*(Number(r.Width)||0)*(Number(r.DepthNos)||0) + (Number(r.Contingency)||0);
  var effRate = (r.RevisedRate!==''&&r.RevisedRate!==undefined&&r.RevisedRate!==null) ? (Number(r.RevisedRate)||0) : (Number(r.Rate)||0);
  r.Quantity = qty; r.EffectiveRate = effRate; r.Amount = qty*effRate;
}
function onBoqFieldInput(boqItemId, field, value){
  var r = STATE.data.boqItems.filter(function(x){return x.BoqItemID===boqItemId;})[0];
  if(!r) return;
  var keyMap = { length:'Length', width:'Width', depthNos:'DepthNos', contingency:'Contingency', revisedRate:'RevisedRate' };
  r[keyMap[field]] = (field==='revisedRate' && value==='') ? '' : (Number(value)||0);
  boqRowRecompute_(r);
  var qtyEl = document.getElementById('boq-qty-'+boqItemId);
  var amtEl = document.getElementById('boq-amount-'+boqItemId);
  if(qtyEl) qtyEl.textContent = r.Quantity;
  if(amtEl) amtEl.textContent = fmtMoney(r.Amount);
  var stripEl = document.getElementById('boq-stat-strip');
  if(stripEl) stripEl.innerHTML = boqStatStripHtml(projectCashSummary(STATE.currentProjectId));
  var catEl = document.getElementById('boq-category-summary');
  if(catEl) catEl.innerHTML = boqCategorySummaryHtml(categoryBoqSummary(STATE.currentProjectId));
}
function saveBoqField(boqItemId, field, value){
  onBoqFieldInput(boqItemId, field, value);
  var payload = { boqItemId: boqItemId };
  payload[field] = value;
  apiPost('updateBoqItem', payload).catch(function(err){ showErr(err); refresh(); });
}

function refreshBoqImageUi(boqItemId, images){
  var r = STATE.data.boqItems.filter(function(x){return x.BoqItemID===boqItemId;})[0];
  if(r) r.Images = images;
  var grid = document.getElementById('boq-img-grid');

function uploadBoqImage(boqItemId){
  var fileInput = document.getElementById('boq-img-file');
  var file = fileInput.files[0];
  if(!file) return;
  if(file.size > 15*1024*1024){ toast('Image too large (max 15MB)'); fileInput.value=''; return; }
  var statusEl = document.getElementById('boq-img-status');
  if(statusEl) statusEl.textContent = 'Uploading…';
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var maxDim = 1600;
      var scale = Math.min(1, maxDim/Math.max(img.width, img.height));
      var w = Math.max(1, Math.round(img.width*scale)), h = Math.max(1, Math.round(img.height*scale));
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      var dataUrl = canvas.toDataURL('image/jpeg', 0.8);
      var base64 = dataUrl.split(',')[1];
      apiPost('addBoqImage', {
        boqItemId: boqItemId, projectId: STATE.currentProjectId,
        filename: file.name.replace(/\.[^.]+$/,'')+'.jpg', mimeType: 'image/jpeg', dataBase64: base64
      }).then(function(res){
        refreshBoqImageUi(boqItemId, res.images);
        if(statusEl) statusEl.textContent = '';
        fileInput.value = '';
        toast('Image added');
      }).catch(function(err){ if(statusEl) statusEl.textContent=''; showErr(err); });
    };
    img.onerror = function(){ if(statusEl) statusEl.textContent=''; toast('Could not read that image'); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function deleteBoqImage(boqItemId, fileId){
  apiPost('removeBoqImage', { boqItemId: boqItemId, fileId: fileId }).then(function(res){
    refreshBoqImageUi(boqItemId, res.images);
  }).catch(showErr);
}

// Agencies among this space's BOQ lines that still have a pending Order
// Placement stage — independent of Schedule (Phase 8 decoupled the two),
// computed directly from BOQ_ITEMS so the checkbox always has something
// real to bulk-mark, regardless of which execution Stage is active.
function agenciesWithPendingOrderPlacement(projectId, spaceId){
  var seen = {}, out = [];
  boqItemsOf(projectId, spaceId).forEach(function(r){
    var pending = r.Stages.some(function(s){ return s.stage==='Order Placement' && s.status!=='Done'; });
    if(pending && !seen[r.Agency]){ seen[r.Agency]=true; out.push(r.Agency); }
  });
  return out;
}

// offers to finalize the single next one, matching how design actually

  return design.filter(function(d){ return d.status!=='Done'; })[0] || null;

function submitDailyLog(){

  localStorage.setItem('pmc_logged_by', by);
  STATE.loggedByName = by;

// ============================= PROGRESS REPORT =============================
function plannedVsActual(pid){
  var p = STATE.data.projects.filter(function(x){return x.ProjectID===pid;})[0];
  var acts = activitiesOf(pid);
  var planned = p.TargetMoveIn;
  var projected = acts.length ? acts.map(function(a){return a.EndDate;}).sort().slice(-1)[0] : planned;
  var delta = (planned && projected) ? dayDiff(planned, projected) : 0; // >0 = projected finish is later than planned
  return { planned: planned, projected: projected, delta: delta };
}
function pendingProcurement(pid){
  var out = [];
  boqItemsOf(pid).forEach(function(r){
    var order = r.Stages.filter(function(s){return s.stage==='Order Placement';})[0];
    var delivery = r.Stages.filter(function(s){return s.stage==='Delivery';})[0];
    var sp = STATE.data.spaces.filter(function(s){return s.SpaceID===r.SpaceID;})[0];
    if(order && order.status!=='Done' && order.status!=='N/A'){
      out.push({space: sp?sp.Name:'', material: r.MaterialName, stage:'Order Placement', status: order.status, etd: null});
    } else if(delivery && delivery.status!=='Done' && delivery.status!=='N/A'){
      out.push({space: sp?sp.Name:'', material: r.MaterialName, stage:'Delivery', status: delivery.status, etd: delivery.target});
    }
  });
  return out;
}
function delayedAgencies(pid){
  var today = todayISO();
  return activitiesOf(pid).filter(function(a){
    return deriveVisual(a.Status, a.OriginalEndDate, a.EndDate).delayed;
  }).map(function(a){
    var sp = STATE.data.spaces.filter(function(s){return s.SpaceID===a.SpaceID;})[0];
    return { agency: a.Agency, space: sp?sp.Name:'', overdueDays: a.EndDate<today ? dayDiff(a.EndDate, today) : 0, status: a.Status };
  });
}
function renderReportView(){
  var pid = STATE.currentProjectId;
  var p = STATE.data.projects.filter(function(x){return x.ProjectID===pid;})[0];
  var pct = projectPct(pid);
  var delayed = delayedItems(pid);
  var pva = plannedVsActual(pid);
  var procurement = pendingProcurement(pid);
  var agencies = delayedAgencies(pid);
  var critical = computeCriticalPath(pid);
  var weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate()-7);
  var completions = [];
  boqItemsOf(pid).forEach(function(r){
    r.Stages.forEach(function(s){
      if(s.status==='Done' && s.actual && new Date(s.actual) >= weekAgo){
        var sp = STATE.data.spaces.filter(function(x){return x.SpaceID===r.SpaceID;})[0];
        completions.push((sp?sp.Name+' &mdash; ':'')+r.MaterialName+' ('+s.stage+') &mdash; '+fmtDate(s.actual));
      }
    });
  });
  var html = '<div class="no-print" style="margin-bottom:14px;"><button class="btn primary" onclick="window.print()">Print / Export</button></div>';
  html += '<div class="report-card">'+
    '<h2>'+escapeHtml(p.Name)+' &mdash; Progress Report</h2>'+
    '<div class="report-sub">'+escapeHtml(p.Address||'')+' &middot; Generated '+fmtDate(todayISO())+'</div>';

  html += '<div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-bottom:18px;">'+
    '<div class="progress-ring" style="--pct:'+pct+';"><div class="ring-label">'+pct+'%</div></div>'+
    '<div style="flex:1;min-width:220px;">'+
      '<div class="label" style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:700;">Planned vs. Projected Finish</div>'+
      '<div style="font-size:15px;margin-top:4px;">Planned: <b>'+fmtDate(pva.planned)+'</b> &nbsp;&middot;&nbsp; Projected: <b>'+fmtDate(pva.projected)+'</b></div>'+
      '<div style="margin-top:4px;">'+(pva.delta>0 ?
        '<span class="badge warn">'+pva.delta+' day'+(pva.delta===1?'':'s')+' behind schedule</span>' :
        pva.delta<0 ? '<span class="badge ok">'+Math.abs(pva.delta)+' day'+(Math.abs(pva.delta)===1?'':'s')+' ahead of schedule</span>' :
        '<span class="badge ok">On schedule</span>')+
      '</div>'+
    '</div></div>';

  html += '<div class="stat-strip"><div class="stat-box"><div class="label">Delayed Items</div><div class="value '+(delayed.length?'red':'')+'">'+delayed.length+'</div></div>'+
    '<div class="stat-box"><div class="label">Pending Procurement</div><div class="value '+(procurement.length?'accent':'')+'">'+procurement.length+'</div></div>'+
    '<div class="stat-box"><div class="label">Agencies Running Late</div><div class="value '+(agencies.length?'red':'')+'">'+agencies.length+'</div></div>'+
    '<div class="stat-box"><div class="label">Critical Path Length</div><div class="value">'+critical.length+'</div></div></div>';

  html += '<div class="section-title">This Week\'s Completions</div>';
  html += completions.length ? '<ul class="plain">'+completions.map(function(c){return '<li>'+c+'</li>';}).join('')+'</ul>' : '<p style="color:var(--ink-soft);font-size:13px;">No stage completions logged in the last 7 days.</p>';

  html += '<div class="section-title">Agencies Running Delayed</div>';
  html += agencies.length ? '<ul class="plain">'+agencies.map(function(a){
      return '<li>'+escapeHtml(a.agency)+' &mdash; '+escapeHtml(a.space)+(a.overdueDays>0?' &mdash; '+a.overdueDays+' day'+(a.overdueDays===1?'':'s')+' overdue':' &mdash; marked delayed')+'</li>';
    }).join('')+'</ul>' : '<p style="color:var(--ink-soft);font-size:13px;">None &mdash; every trade is on schedule.</p>';

  html += '<div class="section-title">Pending Procurement</div>';
  html += procurement.length ? '<ul class="plain">'+procurement.map(function(pr){
      return '<li>'+escapeHtml(pr.space)+' &mdash; '+escapeHtml(pr.material)+' &mdash; '+escapeHtml(pr.stage)+' ('+escapeHtml(pr.status)+')'+(pr.etd?' &mdash; ETD '+fmtDate(pr.etd):'')+'</li>';
    }).join('')+'</ul>' : '<p style="color:var(--ink-soft);font-size:13px;">Nothing pending &mdash; all materials ordered/delivered.</p>';

  html += '<div class="section-title">Delayed Items (Stage-level)</div>';
  html += delayed.length ? '<ul class="plain">'+delayed.map(function(d){
      return '<li>'+escapeHtml(d.space)+' &mdash; '+escapeHtml(d.material)+' ('+escapeHtml(d.stage)+') &mdash; target was '+fmtDate(d.target)+(d.delayReason?' &mdash; '+escapeHtml(d.delayReason):'')+'</li>';
    }).join('')+'</ul>' : '<p style="color:var(--ink-soft);font-size:13px;">None &mdash; on track.</p>';

  html += '<div class="section-title">Critical Path <span style="font-weight:400;text-transform:none;letter-spacing:0;">— finish this chain first, or the whole project\'s finish date slips</span></div>';
  html += critical.length ? '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;">'+critical.map(function(a,i){
      var sp = STATE.data.spaces.filter(function(s){return s.SpaceID===a.SpaceID;})[0];
      return (i>0?'<span style="color:var(--ink-soft);">&rarr;</span>':'')+
        '<span class="status-chip vs-grey" style="cursor:pointer;box-shadow:0 0 0 2px var(--accent) inset;" onclick="openActivityDetailModal(\''+a.ActivityID+'\')">'+escapeHtml((sp?sp.Name:'')+' — '+a.Agency)+'</span>';
    }).join('')+'</div>' : '<p style="color:var(--ink-soft);font-size:13px;">No schedule activities yet.</p>';

  html += '</div>';
  return html;
}

// ============================= MANAGE (Admin) =============================

  var spaces = spacesOf(pid);
  var html = '<div class="card" style="max-width:560px;margin-bottom:18px;"><h3>Project Details</h3>'+
    '<div class="field"><label>Name</label><input id="mg-name" value="'+escapeHtml(p.Name)+'"></div>'+
    '<div class="field"><label>Address</label><input id="mg-addr" value="'+escapeHtml(p.Address||'')+'"></div>'+
    '<div class="field-row">'+
      '<div class="field"><label>Start Date</label><input type="date" id="mg-start" value="'+(p.StartDate||'')+'"></div>'+
      '<div class="field"><label>Target Move-in</label><input type="date" id="mg-move" value="'+(p.TargetMoveIn||'')+'"></div>'+
    '</div>'+
    '<div class="field-row">'+
      '<div class="field"><label>Overall Budget</label><input type="number" id="mg-budget" value="'+(p.Budget||0)+'"></div>'+
      '<div class="field"><label>Client Name</label><input id="mg-client" value="'+escapeHtml(p.ClientName||'')+'"></div>'+

    '<button class="btn primary" onclick="saveProjectMeta()">Save Changes</button>'+
    '</div>';

  html += '<div class="card" style="max-width:560px;"><h3>Spaces</h3>';
  var hasFloors = spaces.some(function(s){ return s.Floor; });
  if(hasFloors){
    var byFloor = {};
    spaces.forEach(function(s){ var f = s.Floor||'(No Floor)'; (byFloor[f]=byFloor[f]||[]).push(s); });
    Object.keys(byFloor).forEach(function(floor){
      html += '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);margin:8px 0 4px;">'+escapeHtml(floor)+'</div>';
      byFloor[floor].forEach(function(s){ html += '<div class="chip-remove">'+escapeHtml(s.Name)+'</div>'; });
    });
  } else {
    spaces.forEach(function(s){
      html += '<div class="chip-remove">'+escapeHtml(s.Name)+'</div>';
    });
  }
  html += '<div class="space-adder" style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;">'+
    '<input type="text" id="mg-newspace" placeholder="New space name (e.g. Kitchen)">'+
    '<input type="text" id="mg-newspace-floor" placeholder="Floor (optional, e.g. First)" style="max-width:170px;">'+
    '<button class="btn" onclick="addSpaceToProject()">Add Space</button></div>'+
    '<div style="font-size:11.5px;color:var(--ink-soft);margin-top:6px;">A new space starts empty &mdash; add materials to it from the Planning tab (pick from the Materials Catalog, enter quantity).</div>'+
    '</div>';

  var clientLink = window.location.origin + window.location.pathname + '?project=' + pid + '&role=client';
  html += '<div class="card" style="max-width:560px;margin-top:18px;"><h3>Client Share Link</h3>'+
    '<div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;">Send this to '+escapeHtml(p.ClientName||'the client')+' &mdash; it opens straight into their read-only view, locked to this project only (no role switcher, can\'t browse other projects).</div>'+
    '<div class="field"><input id="mg-clientlink" value="'+escapeHtml(clientLink)+'" readonly onclick="this.select()"></div>'+
    '<button class="btn" onclick="copyClientLink()">Copy Link</button>'+
    '</div>';
  return html;
}
function copyClientLink(){
  var input = document.getElementById('mg-clientlink');
  input.select();
  navigator.clipboard.writeText(input.value).then(function(){
    toast('Link copied');
  }).catch(function(){
    toast('Select the link above and copy manually');
  });
}
function saveProjectMeta(){
  var payload = {
    projectId: STATE.currentProjectId,
    name: document.getElementById('mg-name').value,
    address: document.getElementById('mg-addr').value,
    startDate: document.getElementById('mg-start').value,
    targetMoveIn: document.getElementById('mg-move').value,
    budget: document.getElementById('mg-budget').value,
    clientName: document.getElementById('mg-client').value
  };
  apiPost('updateProject', payload).then(function(){
    toast('Project updated'); refresh();
  }).catch(showErr);
}
function addSpaceToProject(){
  var name = document.getElementById('mg-newspace').value.trim();
  var floor = document.getElementById('mg-newspace-floor').value.trim();
  if(!name){ toast('Enter a space name'); return; }
  apiPost('addSpace', { projectId: STATE.currentProjectId, name: name, floor: floor }).then(function(){
    toast('Space added'); refresh();
  }).catch(showErr);
}

// ============================= MATERIALS CATALOG (Admin, global) =============================
function renderMaterialsCatalogView(){
  var mats = STATE.data.materialsConfig;
  var agencies = STATE.data.schema.agencies;
  var taxonomy = STATE.data.schema.taxonomy;
  var catKeys = Object.keys(taxonomy);
  var byCat = {};
  mats.forEach(function(m){ (byCat[m.Category]=byCat[m.Category]||[]).push(m); });
  var html = '<div class="toolbar-row"><button class="btn" onclick="closeCatalog()">&larr; Back to Projects</button>'+
    '<button class="btn primary" onclick="openAddMaterialToCatalogModal()">+ Add Material</button></div>';
  html += '<div class="section-title">Materials Catalog<span style="font-weight:400;text-transform:none;letter-spacing:0;">'+mats.length+' materials, shared across all projects &mdash; click any field to edit</span></div>';
  catKeys.forEach(function(cat){
    var rows = byCat[cat];
    if(!rows || !rows.length) return;
    html += '<div class="table-wrap" style="margin-bottom:14px;"><table class="tracker"><thead><tr>'+
      '<th>'+escapeHtml(cat)+'</th><th>Subcategory</th><th>Unit</th><th>Rate</th><th>Agency</th></tr></thead><tbody>';
    rows.forEach(function(m){
      html += '<tr>'+
        '<td><input class="inline-edit" value="'+escapeHtml(m.Name)+'" onchange="saveMaterialField(\''+m.MaterialID+'\',\'name\',this.value)"></td>'+
        '<td><select class="inline-edit" onchange="saveMaterialField(\''+m.MaterialID+'\',\'subcategory\',this.value)">'+
          (taxonomy[cat]||[]).map(function(sc){return '<option '+(m.Subcategory===sc?'selected':'')+'>'+escapeHtml(sc)+'</option>';}).join('')+
        '</select></td>'+
        '<td><input class="inline-edit" style="width:70px;" value="'+escapeHtml(m.Unit)+'" onchange="saveMaterialField(\''+m.MaterialID+'\',\'unit\',this.value)"></td>'+
        '<td><input class="inline-edit" type="number" style="width:80px;" value="'+(m.Rate||0)+'" onchange="saveMaterialField(\''+m.MaterialID+'\',\'rate\',this.value)"></td>'+
        '<td><select class="inline-edit" onchange="saveMaterialField(\''+m.MaterialID+'\',\'agency\',this.value)">'+
          agencies.map(function(a){return '<option '+(m.Agency===a?'selected':'')+'>'+escapeHtml(a)+'</option>';}).join('')+
        '</select></td>'+
        '</tr>';
    });
    html += '</tbody></table></div>';
  });
  html += '<div class="section-title">Move to a different Category</div><div class="table-wrap"><table class="tracker"><tbody>'+
    mats.map(function(m){
      return '<tr><td>'+escapeHtml(m.Name)+'</td><td><select class="inline-edit" onchange="saveMaterialCategory(\''+m.MaterialID+'\',this.value)">'+
        catKeys.map(function(c){return '<option '+(m.Category===c?'selected':'')+'>'+escapeHtml(c)+'</option>';}).join('')+
        '</select></td></tr>';
    }).join('')+
    '</tbody></table></div>';
  return html;
}
function saveMaterialField(materialId, field, value){
  var m = STATE.data.materialsConfig.filter(function(x){return x.MaterialID===materialId;})[0];
  if(!m) return;
  m[field.charAt(0).toUpperCase()+field.slice(1)] = field==='rate' ? Number(value)||0 : value;
  var payload = { materialId: materialId };
  payload[field] = value;
  apiPost('updateMaterial', payload).catch(function(err){ showErr(err); refresh(); });
}
// Changing Category moves the row into a different grouped table, so (unlike
// other inline edits) this refreshes the whole view; Subcategory resets to
// the new Category's first option since the old one likely no longer applies.
function saveMaterialCategory(materialId, newCategory){
  var taxonomy = STATE.data.schema.taxonomy;
  var newSub = (taxonomy[newCategory]||[])[0] || '';
  apiPost('updateMaterial', { materialId: materialId, category: newCategory, subcategory: newSub }).then(function(){
    toast('Category updated'); refresh();
  }).catch(showErr);
}
function materialFormBody(title, m){
  var agencies = STATE.data.schema.agencies;
  var taxonomy = STATE.data.schema.taxonomy;
  var catKeys = Object.keys(taxonomy);
  var cat = m ? m.Category : catKeys[0];
  return '<h3>'+title+'</h3>'+
    '<div class="field-row">'+
      '<div class="field"><label>Category</label><select id="mt-cat" onchange="renderMtSubcategoryOptions()">'+
        catKeys.map(function(c){return '<option '+(cat===c?'selected':'')+'>'+escapeHtml(c)+'</option>';}).join('')+
      '</select></div>'+
      '<div class="field"><label>Subcategory</label><select id="mt-subcat"></select></div>'+
    '</div>'+
    '<div class="field"><label>Material Name</label><input id="mt-name" value="'+escapeHtml(m?m.Name:'')+'" placeholder="e.g. 19mm Ply"></div>'+
    '<div class="field-row">'+
      '<div class="field"><label>Unit</label><input id="mt-unit" value="'+escapeHtml(m?m.Unit:'')+'" placeholder="e.g. Sq. Ft"></div>'+
      '<div class="field"><label>Rate</label><input type="number" id="mt-rate" value="'+(m?m.Rate:'')+'"></div>'+
    '</div>'+
    '<div class="field"><label>Agency</label><select id="mt-agency">'+
      agencies.map(function(a){return '<option '+(m&&m.Agency===a?'selected':'')+'>'+a+'</option>';}).join('')+
    '</select></div>';
}
function renderMtSubcategoryOptions(){
  var taxonomy = STATE.data.schema.taxonomy;
  var cat = document.getElementById('mt-cat').value;
  document.getElementById('mt-subcat').innerHTML = (taxonomy[cat]||[]).map(function(sc){
    return '<option>'+escapeHtml(sc)+'</option>';
  }).join('');
}
function openAddMaterialToCatalogModal(){
  var body = materialFormBody('Add Material', null)+
    '<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button>'+
    '<button class="btn primary" onclick="saveNewMaterial()">Add</button></div>';
  showModal(body);
  renderMtSubcategoryOptions();
}
function saveNewMaterial(){
  var payload = {
    category: document.getElementById('mt-cat').value,
    subcategory: document.getElementById('mt-subcat').value,
    name: document.getElementById('mt-name').value.trim(),
    unit: document.getElementById('mt-unit').value.trim(),
    rate: document.getElementById('mt-rate').value,
    agency: document.getElementById('mt-agency').value
  };
  if(!payload.category || !payload.name || !payload.unit){ toast('Category, name and unit are required'); return; }
  apiPost('addMaterial', payload).then(function(){
    closeModal(); toast('Material added'); refresh();
  }).catch(showErr);
}

// ============================= CLIENT VIEW =============================
function renderClientView(){
  var pid = STATE.currentProjectId;
  var p = STATE.data.projects.filter(function(x){return x.ProjectID===pid;})[0];
  var pct = projectPct(pid);
  var dtm = daysToMoveIn(p);
  var spaces = spacesOf(pid);

  var html = '<div class="client-hero"><div class="lbl">Days to Move-in</div>'+
    '<div class="big">'+(dtm!==null ? (dtm>=0? dtm : 0) : '&mdash;')+'</div>'+
    (dtm!==null && dtm<0 ? '<div style="opacity:.8;font-size:13px;">Target date passed &mdash; '+Math.abs(dtm)+' days ago</div>' : '<div style="opacity:.8;font-size:13px;">Target move-in: '+fmtDate(p.TargetMoveIn)+'</div>')+
    '</div>';

  html += '<div class="client-grid">'+
    statBox('Overall Progress', pct+'%','accent')+
    '</div>';

  var cash = projectCashSummary(pid);
  var byCategory = categoryBoqSummary(pid);
  if(cash.boq>0){
    html += '<div class="card" style="margin-bottom:18px;"><h3>Budget Overview</h3>'+
      '<div style="font-size:22px;font-weight:800;margin-bottom:8px;">'+fmtMoney(cash.boq)+'</div>'+
      '<div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;">Total BOQ value, by category:</div>'+
      '<ul class="plain">'+byCategory.slice(0,8).map(function(c){
        return '<li>'+escapeHtml(c.category)+' &mdash; '+fmtMoney(c.total)+'</li>';
      }).join('')+'</ul></div>';
  }

  html += '<div class="section-title">Progress by Space</div><div class="grid-cards">';
  spaces.forEach(function(s){
    var p2 = spacePct(pid, s.SpaceID);
    html += '<div class="card"><h3>'+escapeHtml(s.Name)+'</h3>'+
      '<div class="pct-row"><div class="pct-bar"><div style="width:'+p2+'%"></div></div><div class="pct-num">'+p2+'%</div></div>'+
      spaceActivityChips(pid, s.SpaceID)+
      '</div>';
  });
  html += '</div>';

  if(activitiesOf(pid).length){
    html += '<div class="section-title">Project Timeline</div>'+
      renderScheduleChart(pid, { readOnly: true, gridId: 'schedGridClient', svgId: 'schedSvgClient' });
  }
  return html;
}

// ============================= NEW PROJECT MODAL =============================
var newProjectSpaces = ['Drawing Room'];
function openNewProjectModal(){
  newProjectSpaces = ['Drawing Room'];
  renderNewProjectModal();
}
function renderNewProjectModal(){
  var body = '<h3>New Project</h3>'+
    '<div class="field"><label>Project Name</label><input id="np-name" placeholder="e.g. Verma Residence"></div>'+
    '<div class="field"><label>Address</label><input id="np-addr" placeholder="e.g. Shahpura, Bhopal"></div>'+
    '<div class="field-row">'+
      '<div class="field"><label>Start Date</label><input type="date" id="np-start" value="'+todayISO()+'"></div>'+
      '<div class="field"><label>Target Move-in</label><input type="date" id="np-move"></div>'+
    '</div>'+
    '<div class="field-row">'+
      '<div class="field"><label>Overall Budget</label><input type="number" id="np-budget" placeholder="0"></div>'+
      '<div class="field"><label>Client Name</label><input id="np-client" placeholder="e.g. Rohit Verma"></div>'+
    '</div>'+
    '<div class="field"><label>Spaces</label><div id="np-space-chips">'+renderSpaceChips()+'</div>'+
      '<div class="space-adder"><input type="text" id="np-newspace" placeholder="Add a space, e.g. Kitchen" onkeydown="if(event.key===\'Enter\'){event.preventDefault();addNPSpace();}">'+
      '<button class="btn small" onclick="addNPSpace()">Add</button></div></div>'+
    '<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button>'+
    '<button class="btn primary" onclick="createProject()">Create Project</button></div>';
  showModal(body);
}
function renderSpaceChips(){
  return newProjectSpaces.map(function(name, i){
    return '<span class="chip-remove">'+escapeHtml(name)+' <button onclick="removeNPSpace('+i+')">&times;</button></span>';
  }).join('');
}
function addNPSpace(){
  var input = document.getElementById('np-newspace');
  var v = input.value.trim();
  if(!v) return;
  newProjectSpaces.push(v);
  input.value='';
  document.getElementById('np-space-chips').innerHTML = renderSpaceChips();
}
function removeNPSpace(i){
  newProjectSpaces.splice(i,1);
  document.getElementById('np-space-chips').innerHTML = renderSpaceChips();
}
function createProject(){
  var name = document.getElementById('np-name').value.trim();
  if(!name){ toast('Project name is required'); return; }
  var payload = {
    name: name,
    address: document.getElementById('np-addr').value,
    startDate: document.getElementById('np-start').value,
    targetMoveIn: document.getElementById('np-move').value,
    budget: document.getElementById('np-budget').value,
    clientName: document.getElementById('np-client').value,
    spaces: newProjectSpaces.length ? newProjectSpaces : ['Drawing Room']
  };
  apiPost('addProject', payload).then(function(res){
    closeModal(); toast('Project created');
    return apiGet('getAllData').then(function(data){
      STATE.data = data; STATE.currentProjectId = res.projectId; STATE.currentTab = defaultTabForRole(); render();
    });
  }).catch(showErr);
}

// ============================= MODAL PLUMBING =============================
function showModal(bodyHtml){
  document.getElementById('modalRoot').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">'+bodyHtml+'</div></div>';
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

boot();
